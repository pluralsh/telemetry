# Meter server configuration. Copy to config/meter.yaml and adjust.
# Complete field semantics: config/README.md

# Server role: standalone (default), writer, or reader.
# Standalone serves reads and writes and requires sharding.backend: standalone.
mode: standalone

# Optional prefix for public read and write APIs. Health, readiness, and metrics
# endpoints remain unprefixed. Default: empty.
# path_prefix: /meter

listeners:
  http: 0.0.0.0:8080 # HTTP bind address (default 0.0.0.0:8080).
  grpc: 0.0.0.0:9090 # Internal writer gRPC bind address (default 0.0.0.0:9090).

storage:
  # SlateDB object-key prefix. Namespace and shard suffixes are added by Meter.
  path: meter # Default: data.

  # Optional SlateDB TOML/JSON/YAML settings file. Without this, SlateDB loads
  # its standard local settings files and SLATEDB_ environment overrides.
  # settings_path: /etc/meter/SlateDb.toml

  # Object-store variants are case-sensitive: Local, Aws, Azure, Gcp, or InMemory.
  object_store:
    type: Local
    path: .data
  # object_store:
  #   type: Aws
  #   region: us-east-1
  #   bucket: meter
  #   endpoint: http://minio:9000 # Optional S3-compatible endpoint.
  #   allow_http: true
  #   virtual_hosted_style: false
  #   # Credentials use standard AWS environment variables or ambient identity.
  # object_store:
  #   type: Azure
  #   account: telemetry
  #   container: meter
  #   endpoint: http://azurite:10000/telemetry # Optional.
  #   allow_http: true
  #   # Supports account key, SAS, bearer token, service principal, workload
  #   # identity, and managed identity through AZURE_* environment variables.
  # object_store:
  #   type: Gcp
  #   bucket: meter
  #   base_url: http://gcs-emulator:4443 # Optional.
  #   # Uses GOOGLE_* credentials or application default credentials.
  # object_store:
  #   type: InMemory # Development/testing only; data is process-local.

  # Optional SST data-block cache. Both block_cache and meta_cache accept
  # FoyerHybrid or FoyerMemory. Omit either key to disable that cache side.
  block_cache:
    type: FoyerHybrid
    memory_capacity: 536870912 # Bytes; 512 MiB.
    disk_capacity: 10737418240 # Bytes; 10 GiB.
    disk_path: .cache/meter
    # Full optional tuning defaults:
    write_policy: WriteOnInsertion # Or WriteOnEviction.
    flushers: 4
    # Bytes. If omitted, effective default is memory_capacity / 32 (16 MiB
    # here); each flusher double-buffers, so allocation is approximately 2x.
    buffer_pool_size: 16777216
    submit_queue_size_threshold: 1073741824 # Bytes; 1 GiB.
  # FoyerMemory alternative:
  # block_cache:
  #   type: FoyerMemory
  #   capacity: 536870912 # Bytes.
  #   shards: 8 # Optional; absent lets Foyer derive this from available CPUs.

  # Metadata (indexes, filters, stats) is commonly kept entirely in memory.
  meta_cache:
    type: FoyerMemory
    capacity: 134217728 # Bytes; 128 MiB.
    # shards: 8 # Optional; absent lets Foyer choose.
  # FoyerHybrid is also valid for metadata and has the same fields shown above.

# Per-shard Moka query cache limit. Despite the field name and historical
# default, the current unweighted implementation counts time-bucket entries,
# not bytes. Default: 268435456.
reader_cache_capacity: 268435456

write:
  # applied: in-memory delta; written: SlateDB mutable state/fresh snapshot;
  # durable: object-store flush before acknowledgement. Default: written.
  durability: written
  # Seconds between durable writer flushes. Default 60; 0 disables the task.
  flush_interval_seconds: 60
  # Maximum concurrent shard-forwarding batches. Default 16.
  remote_concurrency: 16
  # Retries after the initial stale-ownership gRPC attempt. Default 2.
  remote_retries: 2

sharding:
  virtual_shards: 8 # Default 8; must be greater than zero.
  io_concurrency_multiplier: 4 # Default 4; global shard I/O permits per open shard.
  backend: standalone

  # Static split-deployment alternative. Ranges are half-open and must exactly
  # cover [0, virtual_shards); owner_id must match an owners[].id.
  # backend: static
  # owner_id: meter-0
  # owners:
  #   - id: meter-0
  #     ordinal: 0
  #     endpoint: meter-0:9090
  #     start_shard: 0
  #     end_shard: 4
  #   - id: meter-1
  #     ordinal: 1
  #     endpoint: meter-1:9090
  #     start_shard: 4
  #     end_shard: 8

  # Kubernetes alternative and all defaults. Writers are discovered from the
  # StatefulSet; assignments use a ConfigMap and ownership uses Leases.
  # backend: kubernetes
  # namespace: default
  # stateful_set: meter
  # headless_service: meter-headless
  # owner_port: 9090
  # assignment_config_map: meter-shard-assignments
  # coordinator_lease: meter-shard-coordinator
  # shard_lease_prefix: meter-shard
  # lease_duration_seconds: 15
  # renew_interval_seconds: 5
  # watch_poll_interval_seconds: 2

auth:
  # HTTP namespace APIs deny anonymous requests by default. Set this to true
  # only when anonymous read/write access is intentional.
  unauthenticated: false
  # Optional writer-to-writer Bearer token. It does not authorize HTTP APIs.
  # Every participating process must resolve the same value.
  internal: { source: env, name: METER_INTERNAL_TOKEN }
  # Secret alternatives accepted anywhere a Secret is used:
  # internal: { source: file, path: /var/run/secrets/meter/internal-token }
  # internal: { source: literal, value: development-only }

  # Optional external Bearer JWT verification. A file JWKS is loaded once at
  # startup. A URL JWKS is loaded at startup, refreshed lazily on interval, and
  # refreshed early (rate-limited to the interval) for an unknown kid.
  # jwt:
  #   jwks: { source: file, path: /var/run/secrets/meter/jwks.json }
  #   # URL alternative (must be a valid http:// or https:// URL):
  #   # jwks: { source: url, url: https://issuer.example/.well-known/jwks.json }
  #   issuer: https://issuer.example/ # Optional exact iss; required if set.
  #   audience: meter # Optional aud; audience validation is off if omitted.
  #   refresh_interval_seconds: 300 # Default; must be greater than zero.
  #   request_timeout_seconds: 5 # URL HTTP timeout; default, > 0.
  #
  # JWT header: a nonempty kid and supported alg matching the JWKS.
  # Required claims:
  #   exp: validated expiration timestamp
  #   namespace: Rust regex matched against the requested namespace
  #              (use ^default$ for an exact match)
  #   permission: exactly "read" or "write"
  # Optional claim: nbf (validated when present).
  # iss/aud become required when issuer/audience above are configured.

  # Global Basic credentials are alternatives accepted for every namespace.
  # Empty lists do not enable anonymous access.
  global:
    read: []
    write: []
    # read:
    #   - type: basic
    #     username: global-reader
    #     password: { source: env, name: METER_GLOBAL_READ_PASSWORD }

# At least one unique namespace is required. Names are 1-255 bytes and cannot
# contain NUL or ASCII control characters. Only configured names are served.
namespaces:
  - name: default
    auth:
      # Namespace Basic credentials are alternatives to matching global Basic
      # credentials and valid JWTs, and are scoped by read/write permission.
      read:
        - type: basic
          username: prometheus
          password: { source: file, path: /var/run/secrets/meter/read-password }
      write:
        - type: basic
          username: remote-writer
          password: { source: env, name: METER_WRITE_PASSWORD }

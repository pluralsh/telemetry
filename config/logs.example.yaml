# Logs server configuration. Copy to config/logs.yaml and adjust.
mode: standalone
listeners:
  http: 0.0.0.0:3100
  grpc: 0.0.0.0:9091
path_prefix: ""

storage:
  type: SlateDb
  path: logs
  object_store:
    type: Local
    path: .data
  block_cache:
    type: FoyerHybrid
    memory_capacity: 536870912
    disk_capacity: 10737418240
    disk_path: .cache/logs
  meta_cache:
    type: FoyerMemory
    capacity: 134217728

segment_duration_seconds: 3600
retention_seconds: 2592000
page:
  target_size_bytes: 1048576
  max_rows: 8192
  rows_per_block: 256

compaction:
  enabled: true
  fan_in: 8
  min_age_seconds: 30
  finalize_after_seconds: 300
  delete_delay_seconds: 600
  max_merges_per_flush: 256

write:
  durability: applied
  # Durable object-store flush and read-replica visibility interval.
  flush_interval_seconds: 10
  buffer_queue_capacity: 10000
  buffer_flush_interval_milliseconds: 10000
  buffer_size_threshold_bytes: 67108864
  remote_concurrency: 16
  remote_retries: 2

sharding:
  shards: 1
  io_concurrency_limit: 128
  backend: standalone

request:
  max_request_bytes: 10485760
  max_query_entries: 5000
  max_query_pages: 10000
  max_structured_metadata_fields: 128
  query_concurrency: 16
  max_in_flight_query_bytes: 134217728

cache_warmer:
  enabled: false
  warm_range_seconds: 7200
  timeout_seconds: 30
  concurrency: 2
  include_payloads: false

auth:
  # Namespace HTTP APIs require valid credentials unless this is explicitly true.
  unauthenticated: false
  global:
    read: []
    write: []

namespaces:
  - name: default
    auth:
      read: []
      write: []

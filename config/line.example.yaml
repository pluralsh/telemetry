# Line server configuration. Copy to config/line.yaml and adjust.
mode: standalone
listeners:
  http: 0.0.0.0:3100
  grpc: 0.0.0.0:9091

storage:
  type: SlateDb
  path: line
  object_store:
    type: Local
    path: .data
  block_cache:
    type: FoyerHybrid
    memory_capacity: 536870912
    disk_capacity: 10737418240
    disk_path: .cache/line
  meta_cache:
    type: FoyerMemory
    capacity: 134217728

segment_duration_seconds: 3600
retention_seconds: 2592000
page:
  target_size_bytes: 1048576
  max_rows: 8192
  max_age_seconds: 5
  rows_per_block: 256

# Periodic L0 flush interval; accepted writes become query-visible after flush.
visibility_interval_seconds: 1

write:
  durability: written
  remote_concurrency: 16
  remote_retries: 2

sharding:
  virtual_shards: 8
  io_concurrency_multiplier: 8
  backend: standalone

request:
  max_request_bytes: 10485760
  max_query_entries: 5000
  max_query_pages: 10000
  max_structured_metadata_fields: 128
  query_concurrency: 16
  max_in_flight_query_bytes: 134217728

cache:
  query_entries: 256

auth:
  # Namespace HTTP APIs require valid credentials unless this is explicitly true.
  unauthenticated: false
  global:
    read: []
    write: []

namespaces:
  - name: default
    auth:
      read: []
      write: []

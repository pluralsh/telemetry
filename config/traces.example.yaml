# Traces server configuration. Copy to config/traces.yaml and adjust.
mode: standalone
listeners:
  http: 0.0.0.0:3200
  grpc: 0.0.0.0:9092
  otlp_grpc: 0.0.0.0:4317
  jaeger_grpc: 0.0.0.0:14250
path_prefix: ""

storage:
  type: SlateDb
  path: traces
  object_store:
    type: Local
    path: .data
  block_cache:
    type: FoyerHybrid
    memory_capacity: 536870912
    disk_capacity: 10737418240
    disk_path: .cache/traces
  meta_cache:
    type: FoyerMemory
    capacity: 134217728

segment_duration_seconds: 3600
retention_seconds: 2592000
page:
  target_size_bytes: 1048576
  max_size_bytes: 4194304
  max_traces: 1024

write:
  durability: applied
  # Durable object-store flush and read-replica visibility interval.
  flush_interval_seconds: 10
  buffer_queue_capacity: 10000
  buffer_flush_interval_milliseconds: 10000
  buffer_size_threshold_bytes: 67108864
  remote_concurrency: 16
  remote_retries: 2

sharding:
  shards: 1
  io_concurrency_limit: 128
  backend: standalone

request:
  max_request_bytes: 33554432
  max_decoded_request_bytes: 134217728
  request_concurrency: 64
  query_concurrency: 8
  max_candidates: 10000
  max_spans_per_trace: 100000
  max_query_limit: 1000

cache_warmer:
  enabled: false
  warm_range_seconds: 7200
  timeout_seconds: 30
  concurrency: 2
  include_payloads: false

auth:
  # Namespace HTTP and OTLP gRPC APIs require credentials unless enabled.
  unauthenticated: false
  global:
    read: []
    write: []

namespaces:
  - name: default
    auth:
      read: []
      write: []

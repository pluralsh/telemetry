# Track server configuration. Copy to config/track.yaml and adjust.
mode: standalone
listeners:
  http: 0.0.0.0:3200
  grpc: 0.0.0.0:9092
  otlp_grpc: 0.0.0.0:4317
  jaeger_grpc: 0.0.0.0:14250

storage:
  type: SlateDb
  path: track
  object_store:
    type: Local
    path: .data
  block_cache:
    type: FoyerHybrid
    memory_capacity: 536870912
    disk_capacity: 10737418240
    disk_path: .cache/track
  meta_cache:
    type: FoyerMemory
    capacity: 134217728

segment_duration_seconds: 3600
retention_seconds: 2592000
page:
  target_size_bytes: 1048576
  max_size_bytes: 4194304
  max_traces: 1024

write:
  durability: written
  remote_concurrency: 16
  remote_retries: 2

sharding:
  virtual_shards: 8
  io_concurrency_multiplier: 8
  backend: standalone

request:
  max_request_bytes: 10485760
  request_concurrency: 64
  query_concurrency: 8
  max_candidates: 10000
  max_spans_per_trace: 100000
  max_query_limit: 1000

auth:
  # Namespace HTTP and OTLP gRPC APIs require credentials unless enabled.
  unauthenticated: false
  global:
    read: []
    write: []

namespaces:
  - name: default
    auth:
      read: []
      write: []

{{- if and (eq .Values.mode "sharded") .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "metrics.shardingRoleName" . }}
  labels:
    {{- include "metrics.labels" . | nindent 4 }}
rules:
  - apiGroups: ["telemetry.plural.sh"]
    resources: ["shardmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    resourceNames:
      - {{ include "metrics.writerName" . }}
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "metrics.shardingRoleName" . }}
  labels:
    {{- include "metrics.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "metrics.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "metrics.shardingRoleName" . }}
{{- end }}

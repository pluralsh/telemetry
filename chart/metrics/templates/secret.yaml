{{- if and .Values.internalToken.enabled (not .Values.internalToken.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "metrics.internalSecretName" . }}
  labels:
    {{- include "metrics.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.internalToken.key }}: {{ required "internalToken.value is required when no existingSecret is set" .Values.internalToken.value | quote }}
{{- end }}

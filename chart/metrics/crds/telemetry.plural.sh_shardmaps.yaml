---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: shardmaps.telemetry.plural.sh
spec:
  group: telemetry.plural.sh
  names:
    kind: ShardMap
    listKind: ShardMapList
    plural: shardmaps
    shortNames:
    - sm
    singular: shardmap
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.generation
      name: Generation
      type: integer
    - jsonPath: .spec.shard_count
      name: Shards
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ShardMap is the Schema for authoritative telemetry shard routing.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ShardMapSpec is the authoritative routing and writer-ownership snapshot.
              The elected Rust shard coordinator writes it with resourceVersion-based
              compare-and-swap updates; all writer and reader replicas consume it by watch.
            properties:
              assignments:
                items:
                  properties:
                    owner:
                      properties:
                        id:
                          type: string
                        ordinal:
                          format: int32
                          minimum: 0
                          type: integer
                      required:
                      - id
                      - ordinal
                      type: object
                    range:
                      properties:
                        end:
                          format: int32
                          minimum: 1
                          type: integer
                        start:
                          format: int32
                          minimum: 0
                          type: integer
                      required:
                      - end
                      - start
                      type: object
                    state:
                      enum:
                      - pending
                      - active
                      - draining
                      - released
                      type: string
                  required:
                  - owner
                  - range
                  - state
                  type: object
                type: array
              epochs:
                description: |-
                  Epochs are ordered by EffectiveFromNs with non-decreasing shard counts.
                  Scale-up appends an epoch at a future aligned cutover.
                items:
                  description: |-
                    RoutingEpoch is the hash routing for records timestamped at or after
                    EffectiveFromNs, until the next epoch begins. The first epoch starts at the
                    minimum int64 so every timestamp resolves to exactly one epoch.
                  properties:
                    effective_from_ns:
                      format: int64
                      type: integer
                    routing:
                      properties:
                        assignments:
                          items:
                            properties:
                              range:
                                properties:
                                  end:
                                    pattern: ^[0-9a-f]{32}$
                                    type: string
                                  start:
                                    pattern: ^[0-9a-f]{32}$
                                    type: string
                                required:
                                - end
                                - start
                                type: object
                              shard:
                                format: int32
                                minimum: 0
                                type: integer
                            required:
                            - range
                            - shard
                            type: object
                          type: array
                        generation:
                          format: int64
                          minimum: 1
                          type: integer
                      required:
                      - assignments
                      - generation
                      type: object
                  required:
                  - effective_from_ns
                  - routing
                  type: object
                minItems: 1
                type: array
              generation:
                format: int64
                minimum: 1
                type: integer
              shard_count:
                description: |-
                  ShardCount is the number of physical SlateDB storage shards, equal to
                  the latest epoch's shard count. Desired count comes from writer
                  StatefulSet replicas; it only grows because shards are never merged.
                format: int32
                minimum: 1
                type: integer
            required:
            - assignments
            - epochs
            - generation
            - shard_count
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}

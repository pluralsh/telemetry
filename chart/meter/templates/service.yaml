  selector:
    {{- include "meter.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: reader
  ports:
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meter.headlessName" . }}
  labels:
    {{- include "meter.labels" . | nindent 4 }}
    app.kubernetes.io/component: writer
  {{- with .Values.service.headless.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}

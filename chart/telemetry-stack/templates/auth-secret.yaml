{{- define "telemetry-stack.authSecret" -}}
{{- $root := .root }}
{{- $secret := .secret }}
{{- $name := required "auth secret name is required" $secret.name }}
{{- $usernameKey := default "username" $secret.usernameKey }}
{{- $passwordKey := default "password" $secret.passwordKey }}
{{- $password := required (printf "password is required for auth Secret %s" $name) $secret.password }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "telemetry-stack.labels" $root | nindent 4 }}
type: Opaque
stringData:
  {{ $usernameKey }}: {{ required (printf "username is required for auth Secret %s" $name) $secret.username | quote }}
  {{ $passwordKey }}: {{ $password | quote }}
{{- end }}

{{- if .Values.authSecret.create }}
{{- include "telemetry-stack.authSecret" (dict "root" . "secret" .Values.authSecret) }}
{{- end }}

{{- range $secret := .Values.authSecrets }}
{{- include "telemetry-stack.authSecret" (dict "root" $ "secret" $secret) }}
{{- end }}

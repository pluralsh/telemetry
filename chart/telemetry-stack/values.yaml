global:
  storage:
    objectStore:
      type: Aws
      aws:
        region: us-east-2
        bucket: plrl-telemetry-demo
  ingress:
    enabled: true
    hostname: telemetry.plrldemo.onplural.sh
    ingressClass: nginx
    tls:
      enabled: true
      secretName: telemetry-tls

# Optionally create the Secret referenced by authentication entries. Passwords
# are required when creating Secrets so chart rendering stays deterministic.
authSecret:
  create: false
  name: plrl-telemetry-auth
  username: plrl
  password: ""
  usernameKey: username
  passwordKey: password

# Additional Secrets managed by this release. Authentication entries can select
# any of these (or any pre-existing Secret) through their secretKeyRef.
authSecrets: []
# - name: team-a-telemetry-auth
#   username: team-a
#   password: required-value
#   usernameKey: username
#   passwordKey: password
# - name: team-b-telemetry-auth
#   username: team-b
#   password: required-value

products:
  metrics:
    enabled: true
    name: metrics
    spec:
      mode: Sharded
      config:
        storage:
          path: metrics
      ingress:
        pathPrefix: /metrics
        metadata:
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-prod
      writer:
        replicas: 1
        resources:
          limits:
            memory: 4Gi
      reader:
        replicas: 1
        resources:
          limits:
            memory: 4Gi
    authentications: []
    # - name: metrics-authz
    #   namespace: default
    #   username: plrl
    #   permission: write

  logs:
    enabled: true
    name: logs
    spec:
      mode: Sharded
      config:
        storage:
          path: logs
      ingress:
        pathPrefix: /logs
      writer:
        replicas: 1
      reader:
        replicas: 1
    authentications: []
    # - name: logs-authz
    #   namespace: default
    #   username: plrl
    #   permission: write

  traces:
    enabled: true
    name: traces
    spec:
      mode: Sharded
      config:
        storage:
          path: traces
      ingress:
        pathPrefix: /traces
      writer:
        replicas: 1
      reader:
        replicas: 1
    authentications: []
    # - name: traces-authz
    #   namespace: default
    #   username: plrl
    #   permission: write

  # The Vector database, served at {pathPrefix}/api on the shared hostname
  # and in-cluster through the `{name}` Service on port 8080. Only namespaces
  # with an authentication entry (or listed in spec.config.namespaces) exist;
  # write permission lets their credentials create and configure them.
  vector:
    enabled: false
    name: vector
    spec:
      mode: Sharded
      config:
        storage:
          path: vector
      ingress:
        pathPrefix: /vector
      writer:
        replicas: 1
      reader:
        # Replicas per reader group; there is one group per shard.
        replicas: 1
    authentications: []
    # - name: vector-search
    #   namespace: search
    #   username: plrl
    #   permission: write

# BucketCleaners delete a datastore's objects from the bucket when the
# release is uninstalled (or the product is disabled). When enabled, every
# enabled product gets one, named `{name}-data`, for its storage path. It
# waits for the datastore and its pods to be gone before deleting anything.
# The telemetry-operator must still be running when the release is removed,
# and the object store must be Aws, Azure or Gcp.
bucketCleaners:
  enabled: false
  # How often bucket access is re-verified; the operator defaults to 300.
  checkIntervalSeconds: null
  # Further prefixes to clean up. With a dataStoreRef, omitted objectStore
  # and subPath settings come from that datastore's storage; without one,
  # subPath is required and objectStore defaults to global.storage.objectStore.
  additional: []
  # - name: logs-archive
  #   subPath: logs-archive
  #   objectStore:
  #     type: Aws
  #     aws:
  #       region: us-east-2
  #       bucket: plrl-telemetry-archive
  # - name: legacy-metrics
  #   dataStoreRef:
  #     kind: Metrics
  #     name: legacy

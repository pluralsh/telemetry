name: Kind regression

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kind:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - name: Run optional Kubernetes handoff regression
        run: mise exec -- tests/kind/test.sh

name: Publish images

on:
  pull_request:
    paths:
      - .github/workflows/publish-images.yml
      - Cargo.lock
      - Cargo.toml
      - config/**
      - crates/**
      - go/operator/**
      - mise.toml
  push:
    branches: [main]
    tags:
      - "v*.*.*"
    paths:
      - .github/workflows/publish-images.yml
      - Cargo.lock
      - Cargo.toml
      - config/**
      - crates/**
      - go/operator/**
      - mise.toml

permissions:
  contents: read
  packages: write

env:
  DOCKER_METADATA_PR_HEAD_SHA: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: Publish ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: meter
            image: ghcr.io/pluralsh/meter
            context: .
            file: crates/meter-server/Dockerfile
            target: ""
          - name: line
            image: ghcr.io/pluralsh/line
            context: .
            file: crates/line-server/Dockerfile
            target: ""
          - name: telemetry-operator
            image: ghcr.io/pluralsh/telemetry-operator
            context: go/operator
            file: go/operator/Dockerfile
            target: ""
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

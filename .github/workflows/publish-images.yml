name: Publish images

on:
  pull_request:
    paths:
      - .github/workflows/publish-images.yml
      - Cargo.lock
      - Cargo.toml
      - config/**
      - crates/**
      - go/operator/**
      - mise.toml
  push:
    branches: [main]
    tags:
      - "v*.*.*"
    paths:
      - .github/workflows/publish-images.yml
      - Cargo.lock
      - Cargo.toml
      - config/**
      - crates/**
      - go/operator/**
      - mise.toml

permissions:
  contents: read
  packages: write

env:
  DOCKER_METADATA_PR_HEAD_SHA: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: Build ${{ matrix.product.name }} (${{ matrix.platform.arch }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        product:
          - name: metrics
            image: ghcr.io/pluralsh/metrics
            context: .
            file: crates/metrics-server/Dockerfile
          - name: logs
            image: ghcr.io/pluralsh/logs
            context: .
            file: crates/logs-server/Dockerfile
          - name: traces
            image: ghcr.io/pluralsh/traces
            context: .
            file: crates/traces-server/Dockerfile
          - name: pseudofs
            image: ghcr.io/pluralsh/pseudofs
            context: .
            file: crates/pseudofs-server/Dockerfile
          - name: telemetry-operator
            image: ghcr.io/pluralsh/telemetry-operator
            context: go/operator
            file: go/operator/Dockerfile
        platform:
          - arch: amd64
            runner: ubuntu-24.04
            name: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            name: linux/arm64
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.product.image }}
          flavor: |
            suffix=-${{ matrix.platform.arch }},onlatest=true
          tags: |
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.product.context }}
          file: ${{ matrix.product.file }}
          platforms: ${{ matrix.platform.name }}
          push: true
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.product.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.product.name }}-${{ matrix.platform.arch }}

  publish:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    name: Publish ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: metrics
            image: ghcr.io/pluralsh/metrics
          - name: logs
            image: ghcr.io/pluralsh/logs
          - name: traces
            image: ghcr.io/pluralsh/traces
          - name: pseudofs
            image: ghcr.io/pluralsh/pseudofs
          - name: telemetry-operator
            image: ghcr.io/pluralsh/telemetry-operator
    steps:
      - uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
      - name: Create multi-platform manifests
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            docker buildx imagetools create \
              --tag "${tag}" \
              "${tag}-amd64" \
              "${tag}-arm64"
          done <<< "${TAGS}"

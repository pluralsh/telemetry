name: Publish OCI charts

on:
  pull_request:
    paths:
      - .github/workflows/publish-charts.yml
      - chart/**
  push:
    branches: [main]
    tags:
      - "v*.*.*"
    paths:
      - .github/workflows/publish-charts.yml
      - chart/**

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Never cancel a main run: a later push may not include the Chart.yaml
  # change and therefore cannot safely retry an interrupted release publish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  publish-preview:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Publish preview ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: metrics
            path: chart/metrics
          - name: pseudofs
            path: chart/pseudofs
          - name: telemetry-operator
            path: chart/telemetry-operator
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v5
      - name: Resolve chart tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          chart_version=$(awk -F': *' '/^version:/ {print $2; exit}' "${{ matrix.path }}/Chart.yaml")
          test -n "$chart_version"
          echo "pr=0.0.0+pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          echo "sha=0.0.0+sha-${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_OUTPUT"
          echo "master=${chart_version}+master" >> "$GITHUB_OUTPUT"
      - name: Push PR chart
        if: ${{ github.event_name == 'pull_request' }}
        uses: appany/helm-oci-chart-releaser@v0.5.0
        with:
          name: ${{ matrix.name }}
          repository: pluralsh/charts
          tag: ${{ steps.tags.outputs.pr }}
          path: ${{ matrix.path }}
          registry: ghcr.io
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push PR SHA chart
        if: ${{ github.event_name == 'pull_request' }}
        uses: appany/helm-oci-chart-releaser@v0.5.0
        with:
          name: ${{ matrix.name }}
          repository: pluralsh/charts
          tag: ${{ steps.tags.outputs.sha }}
          path: ${{ matrix.path }}
          registry: ghcr.io
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push master chart
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: appany/helm-oci-chart-releaser@v0.5.0
        with:
          name: ${{ matrix.name }}
          repository: pluralsh/charts
          tag: ${{ steps.tags.outputs.master }}
          path: ${{ matrix.path }}
          registry: ghcr.io
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push master SHA chart
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: appany/helm-oci-chart-releaser@v0.5.0
        with:
          name: ${{ matrix.name }}
          repository: pluralsh/charts
          tag: ${{ steps.tags.outputs.sha }}
          path: ${{ matrix.path }}
          registry: ghcr.io
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}
  prepare-release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    name: Prepare chart release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "^1.21.3"
          cache: false
      - uses: azure/setup-helm@v5
      - name: Bump Metrics chart
        uses: pluralsh/chart-releaser@v0.1.3
        with:
          path: ./chart/metrics
          release: ${{ github.ref_name }}
      - name: Bump PseudoFS chart
        uses: pluralsh/chart-releaser@v0.1.3
        with:
          path: ./chart/pseudofs
          release: ${{ github.ref_name }}
      - name: Bump telemetry operator chart
        uses: pluralsh/chart-releaser@v0.1.3
        with:
          path: ./chart/telemetry-operator
          release: ${{ github.ref_name }}
      - name: Verify chart application versions
        shell: bash
        run: |
          set -euo pipefail
          release="${GITHUB_REF_NAME#v}"
          metrics_app_version=$(awk -F': *' '/^appVersion:/ {gsub(/"/, "", $2); print $2; exit}' chart/metrics/Chart.yaml)
          pseudofs_app_version=$(awk -F': *' '/^appVersion:/ {gsub(/"/, "", $2); print $2; exit}' chart/pseudofs/Chart.yaml)
          operator_app_version=$(awk -F': *' '/^appVersion:/ {gsub(/"/, "", $2); print $2; exit}' chart/telemetry-operator/Chart.yaml)
          test "$metrics_app_version" = "$release"
          test "$pseudofs_app_version" = "$release"
          test "$operator_app_version" = "$release"
      - name: Create release metadata pull request
        uses: peter-evans/create-pull-request@v8
        with:
          title: Release ${{ github.ref_name }}
          body: Automated chart metadata update for ${{ github.ref_name }}.
          commit-message: Update charts for ${{ github.ref_name }}
          branch: release-${{ github.ref_name }}
          labels: release
          base: main

  publish-release:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    name: Publish release ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: metrics
            path: chart/metrics
          - name: pseudofs
            path: chart/pseudofs
          - name: telemetry-operator
            path: chart/telemetry-operator
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v5
      - name: Detect committed chart version change
        id: chart
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          CHART_PATH: ${{ matrix.path }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet "$BEFORE" "$AFTER" -- "$CHART_PATH/Chart.yaml"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(awk -F': *' '/^version:/ {print $2; exit}' "$CHART_PATH/Chart.yaml")
          test -n "$version"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Push release chart
        if: ${{ steps.chart.outputs.changed == 'true' }}
        uses: appany/helm-oci-chart-releaser@v0.5.0
        with:
          name: ${{ matrix.name }}
          repository: pluralsh/charts
          tag: ${{ steps.chart.outputs.version }}
          path: ${{ matrix.path }}
          registry: ghcr.io
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}

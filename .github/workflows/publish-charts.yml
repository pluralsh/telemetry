name: Publish OCI charts

on:
  pull_request:
    paths:
      - .github/workflows/publish-charts.yml
      - chart/**
  push:
    branches: [main]
    tags:
      - "v*.*.*"
    paths:
      - .github/workflows/publish-charts.yml
      - chart/**

permissions:
  contents: write
  packages: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  publish-preview:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    name: Publish preview ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: meter
            path: chart/meter
          - name: pseudofs
            path: chart/pseudofs
          - name: telemetry-operator
            path: chart/telemetry-operator
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@v5
      - name: Resolve chart tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          chart_version=$(awk -F': *' '/^version:/ {print $2; exit}' "${{ matrix.path }}/Chart.yaml")
          test -n "$chart_version"
          echo "pr=0.0.0+pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          echo "sha=0.0.0+sha-${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_OUTPUT"
          echo "master=${chart_version}+master" >> "$GITHUB_OUTPUT"
      - name: Push PR chart
        if: ${{ github.event_name == 'pull_request' }}
        uses: appany/helm-oci-chart-releaser@v0.5.0
        with:
          name: ${{ matrix.name }}
          repository: pluralsh/charts
          tag: ${{ steps.tags.outputs.pr }}
          path: ${{ matrix.path }}
          registry: ghcr.io
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push PR SHA chart
        if: ${{ github.event_name == 'pull_request' }}
        uses: appany/helm-oci-chart-releaser@v0.5.0
        with:
          name: ${{ matrix.name }}
          repository: pluralsh/charts
          tag: ${{ steps.tags.outputs.sha }}
          path: ${{ matrix.path }}
          registry: ghcr.io
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push master chart
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: appany/helm-oci-chart-releaser@v0.5.0
        with:
          name: ${{ matrix.name }}
          repository: pluralsh/charts
          tag: ${{ steps.tags.outputs.master }}
          path: ${{ matrix.path }}
          registry: ghcr.io
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push master SHA chart
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: appany/helm-oci-chart-releaser@v0.5.0
        with:
          name: ${{ matrix.name }}
          repository: pluralsh/charts
          tag: ${{ steps.tags.outputs.sha }}
          path: ${{ matrix.path }}
          registry: ghcr.io
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    name: Release charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "^1.21.3"
          cache: false
      - uses: azure/setup-helm@v5
      - name: Bump Meter chart
        uses: pluralsh/chart-releaser@v0.1.3
        with:
          path: ./chart/meter
          release: ${{ github.ref_name }}
      - name: Bump PseudoFS chart
        uses: pluralsh/chart-releaser@v0.1.3
        with:
          path: ./chart/pseudofs
          release: ${{ github.ref_name }}
      - name: Bump telemetry operator chart
        uses: pluralsh/chart-releaser@v0.1.3
        with:
          path: ./chart/telemetry-operator
          release: ${{ github.ref_name }}
      - name: Resolve and verify chart versions
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          release="${GITHUB_REF_NAME#v}"
          meter_version=$(awk -F': *' '/^version:/ {print $2; exit}' chart/meter/Chart.yaml)
          pseudofs_version=$(awk -F': *' '/^version:/ {print $2; exit}' chart/pseudofs/Chart.yaml)
          operator_version=$(awk -F': *' '/^version:/ {print $2; exit}' chart/telemetry-operator/Chart.yaml)
          meter_app_version=$(awk -F': *' '/^appVersion:/ {gsub(/"/, "", $2); print $2; exit}' chart/meter/Chart.yaml)
          pseudofs_app_version=$(awk -F': *' '/^appVersion:/ {gsub(/"/, "", $2); print $2; exit}' chart/pseudofs/Chart.yaml)
          operator_app_version=$(awk -F': *' '/^appVersion:/ {gsub(/"/, "", $2); print $2; exit}' chart/telemetry-operator/Chart.yaml)
          test "$meter_app_version" = "$release"
          test "$pseudofs_app_version" = "$release"
          test "$operator_app_version" = "$release"
          echo "meter=$meter_version" >> "$GITHUB_OUTPUT"
          echo "pseudofs=$pseudofs_version" >> "$GITHUB_OUTPUT"
          echo "operator=$operator_version" >> "$GITHUB_OUTPUT"
      - name: Push Meter release chart
        uses: appany/helm-oci-chart-releaser@v0.5.0
        with:
          name: meter
          repository: pluralsh/charts
          tag: ${{ steps.versions.outputs.meter }}
          path: chart/meter
          registry: ghcr.io
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push PseudoFS release chart
        uses: appany/helm-oci-chart-releaser@v0.5.0
        with:
          name: pseudofs
          repository: pluralsh/charts
          tag: ${{ steps.versions.outputs.pseudofs }}
          path: chart/pseudofs
          registry: ghcr.io
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push telemetry operator release chart
        uses: appany/helm-oci-chart-releaser@v0.5.0
        with:
          name: telemetry-operator
          repository: pluralsh/charts
          tag: ${{ steps.versions.outputs.operator }}
          path: chart/telemetry-operator
          registry: ghcr.io
          registry_username: ${{ github.actor }}
          registry_password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create release metadata pull request
        uses: peter-evans/create-pull-request@v8
        with:
          title: Release ${{ github.ref_name }}
          body: Automated chart metadata update for ${{ github.ref_name }}.
          commit-message: Update charts for ${{ github.ref_name }}
          branch: release-${{ github.ref_name }}
          labels: release
          base: main

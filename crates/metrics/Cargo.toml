[package]
name = "plural-metrics"
description = "Namespace-aware Prometheus-compatible time series database built on SlateDB"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[lib]
name = "plural_metrics"
path = "src/lib.rs"

[features]
default = []
testing = []
remote-write = ["dep:prost", "dep:snap"]
otel = ["dep:opentelemetry-proto", "dep:prost", "opentelemetry-proto/with-serde"]
bench-internals = []

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
blake3.workspace = true
bytes.workspace = true
chrono.workspace = true
common = { path = "../common" }
config.workspace = true
dashmap.workspace = true
foldhash.workspace = true
figment = { version = "0.10.19", features = ["env", "json", "toml", "yaml"] }
futures.workspace = true
metrics.workspace = true
moka.workspace = true
opentelemetry-proto = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
promql-parser.workspace = true
regex.workspace = true
regex-syntax.workspace = true
roaring.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
serde_yaml.workspace = true
sharding = { path = "../sharding" }
slatedb.workspace = true
snap = { workspace = true, optional = true }
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
common = { path = "../common", features = ["test-utils"] }
criterion.workspace = true
dashu-float.workspace = true
fail.workspace = true
mimalloc.workspace = true
proptest.workspace = true
rstest.workspace = true
slatedb = { workspace = true, features = ["test-util"] }
slatedb-common = { workspace = true, features = ["test-util"] }
tempfile.workspace = true

[[bench]]
name = "series_codec"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "promql_ops"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "aggregate"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "query_profile"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "chunk_codec"
harness = false
required-features = ["bench-internals"]

[[bench]]
name = "query_growth"
harness = false
required-features = ["bench-internals"]

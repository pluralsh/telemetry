[package]
name = "meter-server"
description = "Production HTTP and gRPC server for Meter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "meter_server"
path = "src/lib.rs"

[[bin]]
name = "meter-server"
path = "src/main.rs"

[features]
default = ["kubernetes"]
kubernetes = ["sharding/kubernetes", "dep:kube"]

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum = "0.8.9"
base64 = "0.23.1"
blake3.workspace = true
bytes.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
common = { path = "../common" }
futures.workspace = true
http-body-util = "0.1.5"
jsonwebtoken.workspace = true
kube = { workspace = true, optional = true }
meter = { path = "../meter", features = ["remote-write", "otel"] }
metrics.workspace = true
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
opentelemetry-proto.workspace = true
prost.workspace = true
proto = { path = "../proto" }
regex.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_html_form = "0.4.1"
serde_json.workspace = true
serde_urlencoded = "0.7.1"
serde_yaml.workspace = true
sharding = { path = "../sharding" }
slatedb.workspace = true
subtle = "2.6.1"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tonic.workspace = true
tracing.workspace = true
tracing-subscriber = "0.3.23"
utoipa = { version = "6.0.0", features = ["axum_extras"] }

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }

syntax = "proto3";

package line.internal.v1;

service InternalWriter {
  rpc Write(WriteBatchRequest) returns (WriteBatchResponse);
}

message Namespace {
  string name = 1;
}

message Label {
  string name = 1;
  string value = 2;
}

message Field {
  string name = 1;
  string value = 2;
}

message LogEntry {
  int64 timestamp_ns = 1;
  string line = 2;
  repeated Field structured_metadata = 3;
}

message LogBatch {
  repeated Label labels = 1;
  repeated LogEntry entries = 2;
}

message WriteBatchRequest {
  Namespace namespace = 1;
  uint64 assignment_generation = 2;
  uint64 shard_id = 3;
  repeated LogBatch batches = 4;
  Durability durability = 5;
  string request_id = 6;
}

message WriteBatchResponse {
  uint64 assignment_generation = 1;
  uint64 accepted_streams = 2;
  uint64 accepted_entries = 3;
}

enum Durability {
  DURABILITY_APPLIED = 0;
  DURABILITY_WRITTEN = 1;
  DURABILITY_DURABLE = 2;
}

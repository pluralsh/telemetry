[package]
name = "server-common"
description = "Shared HTTP and gRPC server plumbing for Telemetry product servers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
axum = "0.8.9"
base64 = "0.23.1"
blake3.workspace = true
http-body = "1.0.1"
jsonwebtoken.workspace = true
metrics.workspace = true
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
prost.workspace = true
proto = { path = "../proto" }
regex.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
common = { path = "../common" }
sharding = { path = "../sharding" }
snap.workspace = true
subtle = "2.6.1"
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tonic.workspace = true
tower = "0.5.3"
tracing.workspace = true
tower-http = { version = "0.6", default-features = false, features = ["limit", "decompression-gzip"] }

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.5.3", features = ["util"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
flate2 = "1"

[package]
name = "plural-traces-server"
description = "Production HTTP and gRPC server for Traces"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "plural_traces_server"
path = "src/lib.rs"

[[bin]]
name = "plural-traces-server"
path = "src/main.rs"

[features]
default = ["kubernetes"]
kubernetes = ["sharding/kubernetes", "dep:kube"]

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
axum = "0.8.9"
base64 = "0.23.1"
bytes.workspace = true
clap = { version = "4.6.7", features = ["derive"] }
common = { path = "../common" }
futures.workspace = true
kube = { workspace = true, optional = true }
metrics.workspace = true
opentelemetry-proto = { workspace = true, features = ["trace", "with-serde", "gen-tonic"] }
plural-traces = { path = "../traces" }
prost.workspace = true
prost-types = "0.13"
proto = { path = "../proto" }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sharding = { path = "../sharding" }
server-common = { path = "../server-common" }
slatedb.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tonic.workspace = true
tonic-otlp = { package = "tonic", version = "0.12" }
tracing.workspace = true
tracing-subscriber = "0.3.23"
ulid.workspace = true
utoipa = { version = "6.0.0", features = ["axum_extras"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile.workspace = true
tokio-stream = { version = "0.1.19", features = ["net"] }
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
prost-build.workspace = true
protoc-bin-vendored.workspace = true
tonic-build.workspace = true

[package]
name = "plural-logs"
description = "Namespace-aware log storage built on immutable pages and SlateDB"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
base64 = "0.23.1"
blake3.workspace = true
bytes.workspace = true
chrono.workspace = true
common = { version = "0.1.0", path = "../common" }
futures.workspace = true
lalrpop-util = "0.23.1"
linkify = "0.11.0"
logos = "0.16.1"
metrics.workspace = true
minijinja = { version = "2.24", default-features = false, features = ["builtins", "serde", "fuel", "loader", "loop_controls", "macros", "urlencode", "json", "multi_template"] }
rayon = "1.12.0"
regex.workspace = true
regex-syntax.workspace = true
roaring.workspace = true
serde.workspace = true
serde_json.workspace = true
sharding = { path = "../sharding" }
slatedb.workspace = true
snap.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
twox-hash = { version = "2.1.4", default-features = false, features = ["xxhash64"] }
unicode-segmentation = "1.13.3"

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[build-dependencies]
lalrpop = "0.23.1"

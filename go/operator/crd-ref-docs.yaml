processor:
  ignoreTypes:
    - ".*List$"
  ignoreFields:
    - "status$"
    - "TypeMeta$"

render:
  kubernetesVersion: 1.33
  knownTypes:
    - name: ObjectMeta
      package: k8s.io/apimachinery/pkg/apis/meta/v1
      link: https://pkg.go.dev/k8s.io/apimachinery/pkg/apis/meta/v1#ObjectMeta
    - name: PodTemplateSpec
      package: k8s.io/api/core/v1
      link: https://pkg.go.dev/k8s.io/api/core/v1#PodTemplateSpec
    - name: PersistentVolumeClaimSpec
      package: k8s.io/api/core/v1
      link: https://pkg.go.dev/k8s.io/api/core/v1#PersistentVolumeClaimSpec
    - name: EmptyDirVolumeSource
      package: k8s.io/api/core/v1
      link: https://pkg.go.dev/k8s.io/api/core/v1#EmptyDirVolumeSource
    - name: SecretKeySelector
      package: k8s.io/api/core/v1
      link: https://pkg.go.dev/k8s.io/api/core/v1#SecretKeySelector

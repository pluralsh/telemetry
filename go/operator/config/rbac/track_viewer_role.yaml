apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: operator
    app.kubernetes.io/managed-by: kustomize
  name: track-viewer-role
rules:
- apiGroups: [telemetry.plural.sh]
  resources: [tracks]
  verbs: [get, list, watch]
- apiGroups: [telemetry.plural.sh]
  resources: [tracks/status]
  verbs: [get]

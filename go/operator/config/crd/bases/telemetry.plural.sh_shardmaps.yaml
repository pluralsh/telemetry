                        - id
                        - ordinal
                        type: object
                      source_shard:
                        format: int32
                        minimum: 0
                        type: integer
                      target_owner:
                        properties:
                          id:
                            type: string
                          ordinal:
                            format: int32
                            minimum: 0
                            type: integer
                        required:
                        - id
                        - ordinal
                        type: object
                      target_shard:
                        format: int32
                        minimum: 0
                        type: integer
                    required:
                    - moved_range
                    - source_owner
                    - source_shard
                    - target_owner
                    - target_shard
                    type: object
                  target_routing:
                    properties:
                      assignments:

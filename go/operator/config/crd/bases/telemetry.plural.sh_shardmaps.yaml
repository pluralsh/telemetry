---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: shardmaps.telemetry.plural.sh
spec:
  group: telemetry.plural.sh
  names:
    kind: ShardMap
    listKind: ShardMapList
    plural: shardmaps
    shortNames:
    - sm
    singular: shardmap
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.generation
      name: Generation
      type: integer
    - jsonPath: .spec.shard_count
      name: Shards
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ShardMap is the Schema for authoritative telemetry shard routing.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ShardMapSpec is the authoritative routing and writer-ownership snapshot.
              The elected Rust shard coordinator writes it with resourceVersion-based
              compare-and-swap updates; all writer and reader replicas consume it by watch.
            properties:
              assignments:
                items:
                  properties:
                    owner:
                      properties:
                        id:
                          type: string
                        ordinal:
                          format: int32
                          minimum: 0
                          type: integer
                      required:
                      - id
                      - ordinal
                      type: object
                    range:
                      properties:
                        end:
                          format: int32
                          minimum: 1
                          type: integer
                        start:
                          format: int32
                          minimum: 0
                          type: integer
                      required:
                      - end
                      - start
                      type: object
                    state:
                      enum:
                      - pending
                      - active
                      - draining
                      - released
                      type: string
                  required:
                  - owner
                  - range
                  - state
                  type: object
                type: array
              generation:
                format: int64
                minimum: 1
                type: integer
              migration:
                properties:
                  desired_shard_count:
                    format: int32
                    minimum: 1
                    type: integer
                  error:
                    type: string
                  phase:
                    enum:
                    - preparing
                    - prepared
                    - draining
                    - cloning
                    - ready
                    - completing
                    - failed
                    type: string
                  split:
                    properties:
                      moved_range:

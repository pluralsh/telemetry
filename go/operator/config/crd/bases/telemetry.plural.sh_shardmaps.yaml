                              required:
                              - end
                              - start
                              type: object
                            shard:
                              format: int32
                              minimum: 0
                              type: integer
                          required:
                          - range
                          - shard
                          type: object
                        type: array
                      generation:
                        format: int64
                        minimum: 1
                        type: integer
                    required:
                    - assignments
                    - generation
                    type: object
                required:
                - desired_shard_count
                - phase
                - split
                - target_routing
                type: object
              routing:
                properties:
                  assignments:
                    items:
                      properties:
                        range:
                          properties:
                            end:
                              pattern: ^[0-9a-f]{32}$
                              type: string
                            start:
                              pattern: ^[0-9a-f]{32}$
                              type: string
                          required:
                          - end
                          - start

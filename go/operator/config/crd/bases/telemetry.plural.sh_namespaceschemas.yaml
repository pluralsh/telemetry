---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: namespaceschemas.telemetry.plural.sh
spec:
  group: telemetry.plural.sh
  names:
    kind: NamespaceSchema
    listKind: NamespaceSchemaList
    plural: namespaceschemas
    shortNames:
    - nsschema
    singular: namespaceschema
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.dataStoreRef.name
      name: Datastore
      type: string
    - jsonPath: .spec.namespace
      name: Namespace
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: NamespaceSchema declares the attribute schema of a datastore
          namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: NamespaceSchemaSpec defines the desired state of NamespaceSchema.
            properties:
              dataStoreRef:
                properties:
                  kind:
                    enum:
                    - Metrics
                    - Logs
                    - Traces
                    - Vector
                    type: string
                  name:
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                type: object
              namespace:
                description: |-
                  Namespace is the datastore namespace the schema is for. Defaults to
                  the resource's name.
                minLength: 1
                type: string
              schema:
                additionalProperties:
                  description: |-
                    AttributeSchema is the schema of one namespace attribute, as in the
                    datastore's schema API.
                  properties:
                    embed:
                      description: |-
                        Embed embeds a string attribute into the vector of rows written
                        without one. At most one attribute per namespace.
                      type: boolean
                    full_text_search:
                      description: FullTextSearch indexes a string attribute for BM25
                        ranking.
                      type: boolean
                    type:
                      description: Type is fixed once the attribute exists.
                      enum:
                      - string
                      - int
                      - float
                      - bool
                      - '[]string'
                      - '[]int'
                      type: string
                  required:
                  - type
                  type: object
                  x-kubernetes-validations:
                  - message: full_text_search and embed need type string
                    rule: self.type == 'string' || !(has(self.full_text_search) &&
                      self.full_text_search) && !(has(self.embed) && self.embed)
                description: |-
                  Schema maps attribute names to their schemas. Servers merge it into
                  the namespace whenever it changes and when the namespace is created:
                  attributes it names are replaced whole, others are left alone, and an
                  attribute's type can't change once set. Attributes removed from it
                  stay in the namespace.
                minProperties: 1
                type: object
                x-kubernetes-validations:
                - message: attribute names are at most 128 bytes and can't be id,
                    vector, or start with $
                  rule: self.all(name, size(name) <= 128 && name != 'id' && name !=
                    'vector' && !name.startsWith('$'))
                - message: at most one attribute can embed
                  rule: self.filter(name, has(self[name].embed) && self[name].embed).size()
                    <= 1
            required:
            - dataStoreRef
            - schema
            type: object
            x-kubernetes-validations:
            - message: only Vector namespaces have schemas
              rule: self.dataStoreRef.kind == 'Vector'
          status:
            description: NamespaceSchemaStatus defines the observed state of NamespaceSchema.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}

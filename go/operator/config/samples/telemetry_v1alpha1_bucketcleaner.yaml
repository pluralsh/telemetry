apiVersion: telemetry.plural.sh/v1alpha1
kind: BucketCleaner
metadata:
  name: logs-sample-data
spec:
  objectStore:
    type: Aws
    aws:
      region: us-east-1
      bucket: telemetry
      endpoint: https://s3.example.com
      accessKeyIDSecretRef:
        name: telemetry-s3
        key: access-key-id
      secretAccessKeySecretRef:
        name: telemetry-s3
        key: secret-access-key
  subPath: logs-sample

apiVersion: telemetry.plural.sh/v1alpha1
kind: Meter
metadata:
  name: meter-sample
spec:
  mode: Sharded
  image:
    repository: ghcr.io/pluralsh/meter
    tag: 0.1.0
  config:
    storage:
      path: meter
      objectStore:
        type: Aws
        region: us-east-1
        bucket: meter
      blockCache:
        type: FoyerHybrid
        memoryCapacity: 536870912
        diskCapacity: 10737418240
        diskPath: /var/cache/meter
      metaCache:
        type: FoyerMemory
        capacity: 134217728
    write:
      durability: written
      flushIntervalSeconds: 60
      remoteConcurrency: 16
    namespaces:
      - default
  writer:
    replicas: 3
    cacheVolume:
      persistentVolumeClaim:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
    podTemplate:
      spec:
        containers:
          - name: meter
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
  reader:
    replicas: 2
    cacheVolume:
      emptyDir:
        sizeLimit: 20Gi

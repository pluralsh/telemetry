apiVersion: v1
kind: Namespace
metadata: { name: metrics-regression }
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: metrics, namespace: metrics-regression }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: metrics-sharding, namespace: metrics-regression }
rules:
  - apiGroups: [telemetry.plural.sh]
    resources: [shardmaps]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: metrics-sharding, namespace: metrics-regression }
subjects:
  - { kind: ServiceAccount, name: metrics, namespace: metrics-regression }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: metrics-sharding }
---
apiVersion: v1
kind: Service
metadata: { name: metrics-headless, namespace: metrics-regression }
spec:
  clusterIP: None
  selector: { app: metrics-writer }
  ports:
    - { name: grpc, port: 9090 }
---
apiVersion: v1
kind: Service
metadata: { name: metrics-writer, namespace: metrics-regression }
spec:
  selector: { app: metrics-writer }
  ports:
    - { name: http, port: 8080 }
---
apiVersion: v1
kind: Service
metadata: { name: minio, namespace: metrics-regression }
spec:
  selector: { app: minio }
  ports:
    - { name: s3, port: 9000 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: minio, namespace: metrics-regression }
spec:
  replicas: 1
  selector: { matchLabels: { app: minio } }
  template:
    metadata: { labels: { app: minio } }
    spec:
      containers:
        - name: minio
          image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
          args: [server, /data]
          env:
            - { name: MINIO_ROOT_USER, value: metrics }
            - { name: MINIO_ROOT_PASSWORD, value: metrics-regression-secret }
          ports:
            - { name: s3, containerPort: 9000 }
---
apiVersion: batch/v1
kind: Job
metadata: { name: minio-init, namespace: metrics-regression }
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: cgr.dev/chainguard/minio-client@sha256:b8b144ab34694ecea25aa352c4be9de4c26ee2a02701521dce02ee5593c57338
          env:
            - { name: MC_HOST_local, value: "http://metrics:metrics-regression-secret@minio:9000" }
          args: [mb, --ignore-existing, local/metrics-kind]
---
apiVersion: v1
kind: ConfigMap
metadata: { name: metrics-writer-config, namespace: metrics-regression }
data:
  metrics.yaml: |
    mode: writer
    listeners: { http: "0.0.0.0:8080", grpc: "0.0.0.0:9090" }
    storage:
      path: kind
      object_store:
        { type: Aws, region: us-east-1, bucket: metrics-kind, endpoint: "http://minio:9000", allow_http: true }
      block_cache: { type: FoyerMemory, capacity: 33554432 }
      meta_cache: { type: FoyerMemory, capacity: 8388608 }
    reader_cache_capacity: 33554432
    write: { durability: durable, flush_interval_seconds: 1, remote_concurrency: 8, remote_retries: 3 }
    sharding:
      backend: kubernetes
      namespace: metrics-regression
      stateful_set: metrics
      headless_service: metrics-headless
      owner_port: 9090
      shard_map: metrics-shard-map
      coordinator_lease: metrics-shard-coordinator
      shard_lease_prefix: metrics-shard
      lease_duration_seconds: 10
      renew_interval_seconds: 2
    auth:
      internal: { source: literal, value: kind-internal }
      jwt:
        jwks: { source: file, path: /config/jwks.json }
        refresh_interval_seconds: 300
        request_timeout_seconds: 5
      global: { read: [], write: [] }
    namespaces:
      - { name: regression, auth: { read: [], write: [] } }
  jwks.json: |
    {"keys":[{"kty":"oct","kid":"regression-hs256","alg":"HS256","use":"sig","k":"bWV0cmljcy1yZWdyZXNzaW9uLXRlc3Qtb25seS1oczI1Ni1zaWduaW5nLWtleQ"}]}
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: metrics, namespace: metrics-regression }
spec:
  serviceName: metrics-headless
  replicas: 1
  podManagementPolicy: Parallel
  selector: { matchLabels: { app: metrics-writer } }
  template:
    metadata: { labels: { app: metrics-writer } }
    spec:
      serviceAccountName: metrics
      containers:
        - name: metrics
          image: metrics-regression:local
          imagePullPolicy: Never
          args: [--config, /config/metrics.yaml]
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: AWS_ACCESS_KEY_ID, value: metrics }
            - { name: AWS_SECRET_ACCESS_KEY, value: metrics-regression-secret }
            - { name: AWS_DEFAULT_REGION, value: us-east-1 }
            - { name: AWS_ENDPOINT, value: "http://minio:9000" }
            - { name: AWS_ALLOW_HTTP, value: "true" }
          ports:
            - { name: http, containerPort: 8080 }
            - { name: grpc, containerPort: 9090 }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
      volumes:
        - name: config
          configMap: { name: metrics-writer-config }
---
apiVersion: v1
kind: Service
metadata: { name: metrics-reader, namespace: metrics-regression }
spec:
  selector: { app: metrics-reader }
  ports:
    - { name: http, port: 8080 }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: metrics-reader-config, namespace: metrics-regression }
data:
  metrics.yaml: |
    mode: reader
    listeners: { http: "0.0.0.0:8080", grpc: "0.0.0.0:9090" }
    storage:
      path: kind
      object_store:
        { type: Aws, region: us-east-1, bucket: metrics-kind, endpoint: "http://minio:9000", allow_http: true }
      block_cache: { type: FoyerMemory, capacity: 33554432 }
      meta_cache: { type: FoyerMemory, capacity: 8388608 }
    reader_cache_capacity: 33554432
    sharding:
      backend: kubernetes
      namespace: metrics-regression
      stateful_set: metrics
      headless_service: metrics-headless
      owner_port: 9090
      shard_map: metrics-shard-map
      coordinator_lease: metrics-shard-coordinator
      shard_lease_prefix: metrics-shard
      lease_duration_seconds: 10
      renew_interval_seconds: 2
    auth:
      internal: { source: literal, value: kind-internal }
      jwt:
        jwks: { source: file, path: /config/jwks.json }
        refresh_interval_seconds: 300
        request_timeout_seconds: 5
      global: { read: [], write: [] }
    namespaces:
      - name: regression
        auth:
          read:
            - { type: basic, username: regression-reader, password: { source: literal, value: regression-read } }
          write: []
  jwks.json: |
    {"keys":[{"kty":"oct","kid":"regression-hs256","alg":"HS256","use":"sig","k":"bWV0cmljcy1yZWdyZXNzaW9uLXRlc3Qtb25seS1oczI1Ni1zaWduaW5nLWtleQ"}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: metrics-reader, namespace: metrics-regression }
spec:
  replicas: 1
  selector: { matchLabels: { app: metrics-reader } }
  template:
    metadata: { labels: { app: metrics-reader } }
    spec:
      serviceAccountName: metrics
      containers:
        - name: metrics
          image: metrics-regression:local
          imagePullPolicy: Never
          args: [--config, /config/metrics.yaml]
          env:
            - { name: POD_NAME, value: metrics-reader-0 }
            - { name: AWS_ACCESS_KEY_ID, value: metrics }
            - { name: AWS_SECRET_ACCESS_KEY, value: metrics-regression-secret }
            - { name: AWS_DEFAULT_REGION, value: us-east-1 }
            - { name: AWS_ENDPOINT, value: "http://minio:9000" }
            - { name: AWS_ALLOW_HTTP, value: "true" }
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
          volumeMounts:
            - { name: config, mountPath: /config, readOnly: true }
      volumes:
        - name: config
          configMap: { name: metrics-reader-config }

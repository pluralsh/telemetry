name: line-regression

services:
  loki:
    # Pin the multi-architecture image index so local and CI oracles are identical.
    image: grafana/loki:3.5.5@sha256:31628519045e7f28692a7ae73b4a3fd293dccb425585ed5d16ceea3b5c9592e6
    command: ["-config.file=/etc/loki/regression.yaml"]
    volumes:
      - ./loki.yaml:/etc/loki/regression.yaml:ro
      - loki-data:/loki
    ports: ["13100:3100"]

  line:
    build:
      context: ../../../..
      dockerfile: crates/line-server/Dockerfile
    # Named volumes are created root-owned; the regression process initializes
    # them before exercising restart persistence.
    user: "0:0"
    command: ["--config", "/app/regression/line.yaml"]
    volumes:
      - ./line.yaml:/app/regression/line.yaml:ro
      - line-data:/data
    ports: ["13101:3100"]

  line-retention:
    profiles: ["extended"]
    build:
      context: ../../../..
      dockerfile: crates/line-server/Dockerfile
    user: "0:0"
    command: ["--config", "/app/regression/line-retention.yaml"]
    volumes:
      - ./line-retention.yaml:/app/regression/line-retention.yaml:ro
      - line-retention-data:/data
    ports: ["13102:3100"]

volumes:
  loki-data:
  line-data:
  line-retention-data:

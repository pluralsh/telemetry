mode: writer
listeners: { http: "0.0.0.0:3100", grpc: "0.0.0.0:9091" }
storage:
  type: SlateDb
  path: sharded
  object_store:
    type: Aws
    region: us-east-1
    bucket: logs-sharded
    endpoint: http://minio:9000
    allow_http: true
  block_cache: { type: FoyerMemory, capacity: 67108864 }
  meta_cache: { type: FoyerMemory, capacity: 16777216 }
segment_duration_seconds: 60
retention_seconds: 3600
page:
  target_size_bytes: 16384
  max_rows: 128
  rows_per_block: 32
compaction: { min_age_seconds: 1, finalize_after_seconds: 5, delete_delay_seconds: 30 }
write: { durability: durable, flush_interval_seconds: 1, remote_concurrency: 8, remote_retries: 3 }
sharding:
  shards: 2
  io_concurrency_limit: 2
  backend: static
  owner_id: logs-writer-0
  owners:
    - { id: logs-writer-0, ordinal: 0, endpoint: "logs-writer-0:9091", start_shard: 0, end_shard: 1 }
    - { id: logs-writer-1, ordinal: 1, endpoint: "logs-writer-1:9091", start_shard: 1, end_shard: 2 }
auth:
  unauthenticated: true
  internal: { source: env, name: LOGS_INTERNAL_TOKEN }
namespaces:
  - name: regression
    auth: { read: [], write: [] }

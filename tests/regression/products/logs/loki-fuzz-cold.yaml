# The `cold` fuzz scenario: loki-fuzz-historical.yaml (chunks and the TSDB
# index in MinIO, no ingester reads) for a backfilled day of logs. The harness
# wipes /loki before every measured query, so nothing local survives a
# restart: no WAL to replay, no shipped index files, no index cache.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_server_max_recv_msg_size: 33554432

common:
  path_prefix: /loki
  replication_factor: 1
  storage:
    s3:
      endpoint: minio:9000
      bucketnames: loki-fuzz
      access_key_id: logs
      secret_access_key: logs-fuzz-secret
      insecure: true
      s3forcepathstyle: true
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: s3
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index_cache

# The day is pushed hour by hour across all streams, so chunks are cut at
# Loki's defaults (max_chunk_age 2h, chunk_target_size 1.5 MB, idle 30m) as in
# production; the harness flushes the remainder through /flush.
ingester:
  chunk_idle_period: 30m
  chunk_retain_period: 0s
  # Everything is flushed before the first restart; the WAL would only
  # replay flushed chunks into memory.
  wal:
    enabled: false
  # Readiness gate only; ingesters are never queried here.
  lifecycler:
    min_ready_duration: 0s

querier:
  query_ingesters_within: 1s

# A results cache would only answer the warm re-send, which measures the
# data caches. Query sharding stays on as Loki ships it; the battery has no
# unwrapped averages, which sharding rewrites (see loki-fuzz-historical.yaml).
query_range:
  cache_results: false

limits_config:
  allow_structured_metadata: true
  discover_log_levels: false
  discover_service_name: []
  reject_old_samples: false
  unordered_writes: true
  ingestion_rate_mb: 512
  ingestion_burst_size_mb: 1024
  per_stream_rate_limit: 512MB
  per_stream_rate_limit_burst: 1GB
  max_global_streams_per_user: 0
  max_streams_per_user: 0
  shard_streams:
    enabled: false
  max_query_series: 100000
  max_entries_limit_per_query: 5000
  max_cache_freshness_per_query: 24h

analytics:
  reporting_enabled: false

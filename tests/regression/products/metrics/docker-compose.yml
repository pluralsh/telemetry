name: metrics-regression

x-metrics-environment: &metrics-environment
  AWS_ACCESS_KEY_ID: metrics
  AWS_SECRET_ACCESS_KEY: metrics-regression-secret
  AWS_DEFAULT_REGION: us-east-1
  AWS_ENDPOINT: http://minio:9000
  AWS_ALLOW_HTTP: "true"
  METRICS_INTERNAL_TOKEN: internal-regression-token

x-metrics: &metrics
  # CI preloads this tag from a cached buildx build; see regression.yml.
  image: telemetry-regression/plural-metrics-server:local
  build:
    context: ../../../..
    dockerfile: crates/metrics-server/Dockerfile
  environment: *metrics-environment
  depends_on:
    minio-init:
      condition: service_completed_successfully

services:
  prometheus:
    # Native histogram rate extrapolation clips at the zero point from v3.6.
    image: prom/prometheus:v3.14.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      - --web.enable-otlp-receiver
      - --enable-feature=metadata-wal-records
      - --enable-feature=native-histograms
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["19090:9090"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio:
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    command: server /data --address ${MINIO_ADDRESS:-:9000} --console-address :9001
    environment:
      MINIO_ROOT_USER: metrics
      MINIO_ROOT_PASSWORD: metrics-regression-secret
    volumes: ["minio-data:/data"]
    ports: ["19000:9000"]

  # Historical scenario only: owns MinIO's address inside MinIO's network
  # namespace, so every client's `minio:9000` goes through it, and forwards to
  # MinIO on :9010 with a fixed first-byte delay.
  minio-latency:
    profiles: ["historical"]
    image: python:3.13-slim
    network_mode: service:minio
    command:
      - python
      - /proxy.py
      - --listen=9000
      - --upstream=9010
      - --first-byte-ms=${MINIO_FIRST_BYTE_MS:-15}
    volumes: ["../latency-proxy/proxy.py:/proxy.py:ro"]
    depends_on: [minio]

  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:b8b144ab34694ecea25aa352c4be9de4c26ee2a02701521dce02ee5593c57338
    environment:
      MC_HOST_local: http://metrics:metrics-regression-secret@minio:9000
    depends_on:
      minio:
        condition: service_started
    command: ["mb", "--ignore-existing", "local/metrics-regression", "local/mimir-regression"]
    restart: on-failure

  # Object-store-backed oracle sharing MinIO with Metrics. The `MIMIR_*`
  # variables default to Mimir's stock read path (recent data from ingester
  # memory); the fuzz harness overrides them to force store-gateway reads.
  mimir:
    image: grafana/mimir:3.2.1
    profiles: ["mimir"]
    command:
      - -target=all
      - -auth.multitenancy-enabled=false
      - -log.level=warn
      - -server.http-listen-port=8080
      - -common.storage.backend=s3
      - -common.storage.s3.endpoint=minio:9000
      - -common.storage.s3.insecure=true
      - -common.storage.s3.access-key-id=metrics
      - -common.storage.s3.secret-access-key=metrics-regression-secret
      - -common.storage.s3.bucket-name=mimir-regression
      - -blocks-storage.storage-prefix=blocks
      - -ruler-storage.storage-prefix=ruler
      - -alertmanager-storage.storage-prefix=alertmanager
      - -blocks-storage.tsdb.dir=/data/tsdb
      - -blocks-storage.bucket-store.sync-dir=/data/tsdb-sync
      - -compactor.data-dir=/data/compactor
      - -ingester.ring.instance-addr=127.0.0.1
      - -ingester.ring.replication-factor=1
      - -ingester.ring.min-ready-duration=0s
      - -ingester.ring.final-sleep=0s
      - -store-gateway.sharding-ring.replication-factor=1
      - -store-gateway.sharding-ring.instance-addr=127.0.0.1
      - -compactor.ring.instance-addr=127.0.0.1
      - -distributor.ingestion-rate-limit=1000000000
      - -distributor.ingestion-burst-size=1000000000
      - -ingester.max-global-series-per-user=0
      # Rounds rewrite up to 30m of history after earlier rounds were flushed.
      - -ingester.out-of-order-time-window=2h
      # Query sharding (on by default) caches head postings for 10s, so a
      # selector queried just before a write misses the series it creates.
      - -blocks-storage.tsdb.head-postings-for-matchers-cache-ttl=0s
      - -blocks-storage.tsdb.block-postings-for-matchers-cache-ttl=0s
      - -querier.query-engine=${MIMIR_QUERY_ENGINE:-mimir}
      - -querier.query-ingesters-within=${MIMIR_QUERY_INGESTERS_WITHIN:-13h}
      - -querier.query-store-after=${MIMIR_QUERY_STORE_AFTER:-12h}
      - -blocks-storage.bucket-store.ignore-blocks-within=${MIMIR_IGNORE_BLOCKS_WITHIN:-10h}
      - -blocks-storage.bucket-store.sync-interval=5s
      - -compactor.cleanup-interval=5s
    volumes: ["mimir-data:/data"]
    ports: ["19009:8080"]
    depends_on:
      minio-init:
        condition: service_completed_successfully

  # `METRICS_CONFIG_DIR=production` runs the split topology with the
  # operator's settings instead of the small regression ones.
  metrics-writer-0:
    <<: *metrics
    command: ["--config", "/app/regression/writer-0.yaml"]
    volumes:
      - ./${METRICS_CONFIG_DIR:-.}/writer-0.yaml:/app/regression/writer-0.yaml:ro
      - ./jwks.json:/app/regression/jwks.json:ro
    ports: ["18080:8080"]

  metrics-writer-1:
    <<: *metrics
    command: ["--config", "/app/regression/writer-1.yaml"]
    volumes:
      - ./${METRICS_CONFIG_DIR:-.}/writer-1.yaml:/app/regression/writer-1.yaml:ro
      - ./jwks.json:/app/regression/jwks.json:ro
    ports: ["18081:8080"]

  metrics-reader:
    <<: *metrics
    command: ["--config", "/app/regression/reader.yaml"]
    volumes:
      - ./${METRICS_CONFIG_DIR:-.}/reader.yaml:/app/regression/reader.yaml:ro
      - ./jwks.json:/app/regression/jwks.json:ro
    ports: ["18082:8080"]

  # One process and shard over MinIO, the shape of the single-binary oracles;
  # benchmarks use it so reads skip the split topology's per-shard fan-out.
  metrics-s3:
    <<: *metrics
    profiles: ["standalone-s3"]
    command: ["--config", "/app/regression/standalone-s3.yaml"]
    volumes:
      - ./production/standalone-s3.yaml:/app/regression/standalone-s3.yaml:ro
      - ./jwks.json:/app/regression/jwks.json:ro
    ports: ["18084:8080"]

  # One process on local disk, the writers' and reader's storage settings
  # otherwise, so a comparison with Prometheus leaves out the object store.
  metrics-standalone:
    profiles: ["standalone"]
    image: telemetry-regression/plural-metrics-server:local
    build:
      context: ../../../..
      dockerfile: crates/metrics-server/Dockerfile
    environment:
      METRICS_INTERNAL_TOKEN: internal-regression-token
    # Named volumes are created root-owned.
    user: "0:0"
    command: ["--config", "/app/regression/standalone.yaml"]
    volumes:
      - ./standalone.yaml:/app/regression/standalone.yaml:ro
      - ./jwks.json:/app/regression/jwks.json:ro
      - metrics-standalone-data:/data
    ports: ["18083:8080"]

volumes:
  prometheus-data:
  minio-data:
  mimir-data:
  metrics-standalone-data:

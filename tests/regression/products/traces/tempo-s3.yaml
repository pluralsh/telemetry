multitenancy_enabled: true
usage_report:
  reporting_enabled: false

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  trace_idle_period: 1s
  flush_check_period: 1s
  max_block_duration: 2s
  # Flushed blocks leave the ingester shortly after queriers can see them in
  # the bucket, so trace-by-id is served from object storage too.
  complete_block_timeout: 15s

query_frontend:
  search:
    # Search and tag lookups read only flushed blocks in object storage, the
    # same path the Traces reader takes.
    query_backend_after: 0s
    query_ingesters_until: 0s

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: s3
    blocklist_poll: 5s
    wal:
      path: /var/tempo/wal
      ingestion_time_range_slack: 24h
    s3:
      bucket: tempo-regression
      endpoint: minio:9000
      access_key: traces
      secret_key: traces-regression-secret
      insecure: true
      forcepathstyle: true

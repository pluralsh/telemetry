name: traces-regression

x-traces-environment: &traces-environment
  AWS_ACCESS_KEY_ID: traces
  AWS_SECRET_ACCESS_KEY: traces-regression-secret
  AWS_DEFAULT_REGION: us-east-1
  AWS_ENDPOINT: http://minio:9000
  AWS_ALLOW_HTTP: "true"
  TRACES_INTERNAL_TOKEN: internal-regression-token

x-traces: &traces
  # CI preloads this tag from a cached buildx build; see regression.yml.
  image: telemetry-regression/plural-traces-server:local
  build:
    context: ../../../..
    dockerfile: crates/traces-server/Dockerfile
  environment: *traces-environment
  depends_on:
    minio-init:
      condition: service_completed_successfully

services:
  tempo:
    # The fuzzer overrides this with a release that has Tempo's empty-LHS
    # structural operator semantics (2.9+); see harness/fuzz/traces.py.
    image: ${TEMPO_IMAGE:-grafana/tempo:2.8.2}
    command: ["-config.file=/etc/tempo/regression.yaml"]
    volumes:
      - ./${TEMPO_CONFIG:-tempo.yaml}:/etc/tempo/regression.yaml:ro
      - tempo-data:/var/tempo
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "13200:3200"
      - "14319:4317"
      - "14320:4318"
      - "19411:9411"
      - "14253:14250"

  minio:
    image: cgr.dev/chainguard/minio@sha256:bd014394a80898e68c149f2311fdf8d5a2c2f3bb2c33b9327ae6d02b4b065ae1
    command: server /data --address ${MINIO_ADDRESS:-:9000} --console-address :9001
    environment:
      MINIO_ROOT_USER: traces
      MINIO_ROOT_PASSWORD: traces-regression-secret
    volumes: ["minio-data:/data"]

  # Historical scenario only: owns MinIO's address inside MinIO's network
  # namespace, so every client's `minio:9000` goes through it, and forwards to
  # MinIO on :9010 with a fixed first-byte delay.
  minio-latency:
    profiles: ["historical"]
    image: python:3.13-slim
    network_mode: service:minio
    command:
      - python
      - /proxy.py
      - --listen=9000
      - --upstream=9010
      - --first-byte-ms=${MINIO_FIRST_BYTE_MS:-15}
    volumes: ["../latency-proxy/proxy.py:/proxy.py:ro"]
    depends_on: [minio]

  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:b8b144ab34694ecea25aa352c4be9de4c26ee2a02701521dce02ee5593c57338
    environment:
      MC_HOST_local: http://traces:traces-regression-secret@minio:9000
    depends_on:
      minio:
        condition: service_started
    command: ["mb", "--ignore-existing", "local/traces-regression", "local/tempo-regression"]
    restart: on-failure

  # `TRACES_CONFIG_DIR=production` runs the split topology with the
  # operator's settings instead of the small regression ones.
  traces-writer-0:
    <<: *traces
    command: ["--config", "/app/regression/writer-0.yaml"]
    volumes:
      - ./${TRACES_CONFIG_DIR:-.}/writer-0.yaml:/app/regression/writer-0.yaml:ro
      - ./jwks.json:/app/regression/jwks.json:ro
    ports:
      - "13201:3200"
      - "14317:4317"
      - "14251:14250"

  traces-writer-1:
    <<: *traces
    command: ["--config", "/app/regression/writer-1.yaml"]
    volumes:
      - ./${TRACES_CONFIG_DIR:-.}/writer-1.yaml:/app/regression/writer-1.yaml:ro
      - ./jwks.json:/app/regression/jwks.json:ro
    ports:
      - "13202:3200"
      - "14318:4317"
      - "14252:14250"

  traces-reader:
    <<: *traces
    command: ["--config", "/app/regression/reader.yaml"]
    volumes:
      - ./${TRACES_CONFIG_DIR:-.}/reader.yaml:/app/regression/reader.yaml:ro
      - ./jwks.json:/app/regression/jwks.json:ro
    ports: ["13203:3200"]

  # One process and shard over MinIO, the shape of the single-binary oracle;
  # benchmarks use it so reads skip the split topology's per-shard fan-out.
  traces-s3:
    <<: *traces
    profiles: ["standalone-s3"]
    command: ["--config", "/app/regression/standalone-s3.yaml"]
    volumes:
      - ./production/standalone-s3.yaml:/app/regression/standalone-s3.yaml:ro
      - ./jwks.json:/app/regression/jwks.json:ro
    ports:
      - "13205:3200"
      - "14321:4317"

  traces-retention:
    profiles: ["extended"]
    image: telemetry-regression/plural-traces-server:local
    build:
      context: ../../../..
      dockerfile: crates/traces-server/Dockerfile
    user: "0:0"
    command: ["--config", "/app/regression/retention.yaml"]
    volumes:
      - ./retention.yaml:/app/regression/retention.yaml:ro
      - ./jwks.json:/app/regression/jwks.json:ro
      - traces-retention-data:/data
    ports: ["13204:3200"]

volumes:
  tempo-data:
  minio-data:
  traces-retention-data:

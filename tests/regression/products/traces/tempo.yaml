multitenancy_enabled: true
usage_report:
  reporting_enabled: false

server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    zipkin:
      endpoint: 0.0.0.0:9411
    jaeger:
      protocols:
        grpc:
          endpoint: 0.0.0.0:14250

ingester:
  trace_idle_period: 1s
  flush_check_period: 1s
  max_block_duration: 2s

compactor:
  compaction:
    # Long differential fuzz runs query data from the start of the run.
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
      # Fuzz data is backdated across its window; with the 2m default, older
      # spans do not widen block time ranges and time-ranged search skips them.
      ingestion_time_range_slack: 24h
    local:
      path: /var/tempo/blocks

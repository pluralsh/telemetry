# Production settings on a local object store, without MinIO. Limits must
# match IMPL_CONFIGS["local"] in harness/fuzz/pseudofs.py.
listener: 0.0.0.0:9093

filesystem:
  storage:
    type: SlateDb
    path: pseudofs
    object_store:
      type: Local
      path: /var/lib/pseudofs/data
    block_cache:
      type: FoyerHybrid
      memory_capacity: 536870912
      disk_capacity: 10737418240
      disk_path: /var/cache/pseudofs
      write_policy: WriteOnEviction
    meta_cache: { type: FoyerMemory, capacity: 134217728 }
  blobs:
    local_path: /var/lib/pseudofs/blobs
    cache_capacity_bytes: 4294967296
    upload_concurrency: 4
    gc_grace_seconds: 300
  inline_threshold_bytes: 16384
  chunk_size_bytes: 1048576
  max_file_size_bytes: 1073741824
  max_append_generations: 64

max_unary_file_size_bytes: 8388608
max_decoding_message_bytes: 16777216
max_encoding_message_bytes: 16777216

search:
  default_glob_results: 1000
  max_glob_results: 10000
  default_grep_matches: 100
  max_grep_matches: 1000
  max_grep_context_lines: 100
  default_grep_file_size_bytes: 16777216
  max_grep_file_size_bytes: 67108864
  grep_concurrency: 8
  max_scanned_entries: 1000000
  max_grep_seconds: 30
